# Opcional: sobe um PostgreSQL pronto para o MyTask, sem instalar nada além do Docker.
# Uso: docker compose up -d
services:
  db:
    image: postgres:16
    container_name: mytask-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mytask
    ports:
      - "5432:5432"
    volumes:
      - mytask-data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  mytask-data:
